services:
  - type: web
    name: gccx-candidate-triage-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: BACKEND_CORS_ORIGINS
        value: https://your-frontend-domain.example
      - key: GROQ_API_KEY
        sync: false
